<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Health Blueprint — Find Trusted Healthcare in China</title>
  <meta name="description" content="Health Blueprint helps international patients find licensed hospitals in China, compare care programs, and connect with trusted local agents for their entire trip.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='24' y='20' width='15' height='26' fill='%230f6b5c'/%3E%3Cpolygon points='10,50 50,12 90,50' fill='%230f6b5c'/%3E%3Crect x='17' y='47' width='66' height='40' rx='3' fill='%230f6b5c'/%3E%3Crect x='42' y='53' width='16' height='32' rx='2' fill='white'/%3E%3Crect x='28' y='67' width='44' height='16' rx='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="brand" id="brandLink">
        <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
          <rect x="24" y="20" width="15" height="26" fill="currentColor"/>
          <polygon points="10,50 50,12 90,50" fill="currentColor"/>
          <rect x="17" y="47" width="66" height="40" rx="3" fill="currentColor"/>
          <rect x="42" y="53" width="16" height="32" rx="2" fill="#fff"/>
          <rect x="28" y="67" width="44" height="16" rx="2" fill="#fff"/>
        </svg>
        <span class="brand-name" id="brandName">Health Blueprint</span>
      </a>

      <div class="header-controls">
        <a href="#/trip" class="btn btn-secondary btn-nav" id="tripNavLink">🧭 <span id="tripNavLabel">Plan a Trip</span></a>
        <a href="#/join" class="btn btn-primary btn-nav" id="joinNavLink">🤝 <span id="joinNavLabel">Join as an Agent</span></a>

        <div class="font-size-control" role="group" aria-label="Text size">
          <button type="button" id="fontDecrease" class="font-btn">A−</button>
          <button type="button" id="fontReset" class="font-btn font-btn-mid">A</button>
          <button type="button" id="fontIncrease" class="font-btn">A+</button>
        </div>

        <label class="lang-select-wrap">
          <span class="visually-hidden" id="langLabel">Language</span>
          <select id="langSelect" class="lang-select" aria-label="Language"></select>
        </label>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col">
        <h3 id="footerAboutTitle">About Health Blueprint</h3>
        <p id="footerAboutText"></p>
      </div>
      <div class="footer-col">
        <h3 id="footerContactTitle">Contact us</h3>
        <p><a href="mailto:hello@healthblueprint.example">hello@healthblueprint.example</a></p>
      </div>
      <div class="footer-col footer-disclaimer">
        <p id="footerDisclaimer"></p>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="brandNameFooter">Health Blueprint</span> · <span id="footerRights"></span> © <span id="footerYear"></span>
    </div>
  </footer>

  <!-- Static fallback form so Netlify's form-detection bot can register the
       "inquiry" form at deploy time (Netlify requires a plain HTML form
       present in the built output, not one injected purely by JS). -->
  <form name="inquiry" data-netlify="true" netlify-honeypot="company" hidden>
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="text" name="phone">
    <input type="text" name="country">
    <input type="text" name="preferredLanguage">
    <textarea name="message"></textarea>
    <input type="text" name="hospital">
    <input type="text" name="program">
    <input type="text" name="agent">
    <input type="text" name="route">
    <input type="text" name="company">
  </form>

  <!-- Static fallback form so Netlify detects the "agent-application" form
       (same reasoning as above: needed at deploy time, not just from JS). -->
  <form name="agent-application" data-netlify="true" netlify-honeypot="company" enctype="multipart/form-data" hidden>
    <input type="text" name="name">
    <input type="text" name="birthYear">
    <input type="text" name="phone">
    <input type="email" name="email">
    <input type="file" name="resume">
    <input type="text" name="company">
  </form>

  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
