<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Health Blueprint</title>
  <script>
    // Single Page Apps for GitHub Pages: redirects a direct/deep-link request
    // for a path the static host doesn't have a file for (e.g. /hospitals)
    // into a query string on index.html, which decodes it back into the
    // real path before the app boots. See https://github.com/rafgraph/spa-github-pages
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
